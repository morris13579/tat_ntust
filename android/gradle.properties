org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# android.enableR8=true 已移除：AGP 從 7.0 起把它標成 Enforced，
# 讀得到但沒有作用，只會在每次 configuration 多印一個警告。
android.useAndroidX=true
# jetifier 已移除：專案裡沒有任何 com.android.support 相依
# （驗證方式：./gradlew :app:dependencies 對 com.android.support 零命中）。
# 它還會在 Java 21 以上的環境把 lint 的測試相依轉換失敗：
# 'Unsupported class file major version 68'。
android.overridePathCheck=true
kotlin.jvm.target.validation.mode=IGNORE

# Reason: Recently, the Flutter team has received several reports from developers indicating they are experiencing app crashes on certain devices on Android 6.0.
# android.bundle.enableUncompressedNativeLibs=false